# ArdaOS identity — the ONE place the name lives.
# Rename the distro? Change these lines, rebuild. Nothing else to touch.

DISTRO_NAME="ArdaOS"
DISTRO_ID="ardaos"
COMMAND_NAME="arda"          # the main command: arda theme, arda update, ...
EXTRA_COMMANDS="bruh"        # secret aliases for the same command (space separated)

USERNAME="arda"
DEFAULT_PASSWORD="arda"      # change it after first boot with: passwd
HOSTNAME="ardaos"
KEYBOARD_LAYOUT="tr"         # Turkish Q. Use "us" for English layout.

DEFAULT_THEME="tokyo-night"
DEFAULT_FONT="JetBrains Mono"

# Your projects: arda new puts them in ~/projects, arda server publishes them at <name>.DOMAIN
DOMAIN="aardapeker.com"
