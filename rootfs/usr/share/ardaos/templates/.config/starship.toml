# generated by `arda theme` — {{name}}
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "ardaos"
format = """
[╭─](muted)$directory$git_branch$git_status$nodejs$java$cmd_duration
[╰─](muted)$character"""

[palettes.ardaos]
accent = "{{accent}}"
accent2 = "{{accent2}}"
muted = "{{muted}}"
green = "{{green}}"
red = "{{red}}"
yellow = "{{yellow}}"

[directory]
style = "bold accent"
truncation_length = 3
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "accent2"
symbol = "⎇ "
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"

[nodejs]
style = "green"
format = "[⬢ $version]($style) "

[java]
style = "red"
format = "[☕ $version]($style) "

[cmd_duration]
style = "muted"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold red)"
